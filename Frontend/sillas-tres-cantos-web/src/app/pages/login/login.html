<section class="employee-login">
  <div class="login-copy">
    <p class="eyebrow">Portal empleados</p>
    <h1>Acceso privado</h1>
    <p>
      Área interna para gestionar catálogo, disponibilidad, documentación y cuentas autorizadas.
    </p>
    <a routerLink="/" class="back-link">Volver a la web</a>
  </div>

  <form class="login-form" (ngSubmit)="submit()">
    <div class="field">
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" [(ngModel)]="username" required />
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" name="password" autocomplete="current-password" [(ngModel)]="password" required />
    </div>
    <button type="submit" class="btn" [disabled]="loading()">Entrar</button>
    @if (loading()) {
      <p class="status">Autenticando...</p>
    }
    @if (successMessage()) {
      <p class="status ok">{{ successMessage() }}</p>
    }
    @if (errorMessage()) {
      <p class="status error">{{ errorMessage() }}</p>
    }
  </form>
</section>
