<div class="app-shell">
  <header class="site-header" [class.public-header]="showHeaderPhone()">
    <a routerLink="/" class="brand" aria-label="Volver a ORTOPEDIA PUEBLOS 3C">
      ORTOPEDIA PUEBLOS 3C
    </a>
    @if (showHeaderPhone()) {
      <a class="header-call" href="tel:+34918033019" aria-label="Llamar al 918 033 019">
        <span class="header-call-number">918 033 019</span>
      </a>
    }
  </header>

  <main>
    <router-outlet />
  </main>

  @if (showPublicFooter()) {
    <footer class="site-footer">
      <div>
        <a routerLink="/" fragment="conocenos">Conócenos</a>
        <a routerLink="/" fragment="contacto">Contacto</a>
        <a routerLink="/legal" fragment="aviso-legal">Aviso legal</a>
        <a routerLink="/legal" fragment="privacidad">Privacidad</a>
      </div>
      <a routerLink="/login" class="employee-link">Portal empleados</a>
    </footer>
  }
</div>
